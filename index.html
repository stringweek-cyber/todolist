<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘의 계획</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Lucide Icons ESM Map -->
    <script type="importmap">
        {
            "imports": {
                "react": "https://esm.sh/react@18.2.0",
                "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
                "lucide-react": "https://esm.sh/lucide-react@0.292.0"
            }
        }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-50 antialiased">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { Calendar as CalendarIcon, Plus, Trash2, Repeat, Menu, X, Edit2, CheckSquare, ChevronLeft, ChevronRight, Home, AlertCircle, Sun, Moon, Sunrise, Clock, Eye, EyeOff, Check, Sparkles } from 'lucide-react';

        const TodaysPlan = () => {
            // --- State ---
            const [currentDate, setCurrentDate] = useState(new Date());
            const [viewMode, setViewMode] = useState('weekly'); // 'weekly' or 'monthly'
            const [calendarViewDate, setCalendarViewDate] = useState(new Date()); 

            const [tasks, setTasks] = useState(['영어 단어', '국어 인강', '수학 문제집']); 
            const [schedules, setSchedules] = useState({}); 
            const [recurring, setRecurring] = useState([]); 
            
            const [isMenuOpen, setIsMenuOpen] = useState(false); 
            const [noticeMessage, setNoticeMessage] = useState(null);
            
            // Layout & Filter States for Clean View
            const [activePeriod, setActivePeriod] = useState('all'); // 'all', 'morning', 'afternoon', 'evening'
            const [hideEmptySlots, setHideEmptySlots] = useState(false);
            const [activeStampTask, setActiveStampTask] = useState(null); // Selected task for 1-tap quick stamp
            
            // Inline Editing State (No Modal needed!)
            const [editingSlotTime, setEditingSlotTime] = useState(null);
            const [inlineInputText, setInlineInputText] = useState("");

            // Recurring Form State
            const [recurStartAmPm, setRecurStartAmPm] = useState("PM");
            const [recurStartH, setRecurStartH] = useState("");
            const [recurStartM, setRecurStartM] = useState("");
            const [recurEndAmPm, setRecurEndAmPm] = useState("PM");
            const [recurEndH, setRecurEndH] = useState("");
            const [recurEndM, setRecurEndM] = useState("");
            const [recurText, setRecurText] = useState("");
            const [recurDays, setRecurDays] = useState([]); 
            const [editingRecurGroupId, setEditingRecurGroupId] = useState(null); 

            useEffect(() => {
                const savedTasks = JSON.parse(localStorage.getItem('my_tasks_v3') || 'null');
                const savedSchedules = JSON.parse(localStorage.getItem('my_schedules_v2') || '{}');
                const savedRecurring = JSON.parse(localStorage.getItem('my_recurring_v2') || '[]');
                
                if (savedTasks) setTasks(savedTasks);
                else setTasks(['영어 단어', '국어 인강', '수학 문제집']);
                setSchedules(savedSchedules);
                setRecurring(savedRecurring);
            }, []);

            useEffect(() => {
                localStorage.setItem('my_tasks_v3', JSON.stringify(tasks));
                localStorage.setItem('my_schedules_v2', JSON.stringify(schedules));
                localStorage.setItem('my_recurring_v2', JSON.stringify(recurring));
            }, [tasks, schedules, recurring]);

            const showNotice = (msg) => {
                setNoticeMessage(msg);
                setTimeout(() => setNoticeMessage(null), 3000);
            };

            const formatDateKey = (date) => {
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                return `${year}-${month}-${day}`;
            };

            const formatAmPm = (hour) => {
                const h = parseInt(hour, 10);
                const ampm = h < 12 ? 'AM' : 'PM';
                const h12 = h > 12 ? h - 12 : (h === 0 ? 12 : h === 12 ? 12 : h);
                return { ampm, h12 };
            };

            const format12HStr = (timeStr) => {
                if (!timeStr) return '';
                const [hStr, mStr] = timeStr.split(':');
                const { ampm, h12 } = formatAmPm(parseInt(hStr, 10));
                return `${ampm} ${h12}:${mStr}`;
            };

            const to24Hour = (ampm, h, m) => {
                let hour = parseInt(h || 0, 10);
                if (ampm === 'PM' && hour < 12) hour += 12;
                if (ampm === 'AM' && hour === 12) hour = 0;
                return `${hour < 10 ? '0'+hour : hour}:${m || '00'}`;
            };

            const to12HourParts = (timeStr) => {
                const [hStr, mStr] = timeStr.split(':');
                const h = parseInt(hStr, 10);
                const ampm = h >= 12 ? 'PM' : 'AM';
                let h12 = h % 12;
                if (h12 === 0) h12 = 12;
                return { ampm, h: h12.toString(), m: mStr };
            };

            // Generate 30-minute time slots (06:00 to 24:00)
            const ALL_TIME_SLOTS = (() => {
                const slots = [];
                for (let h = 6; h <= 23; h++) {
                    for (let m of [0, 30]) {
                        const val = `${h < 10 ? '0' + h : h}:${m === 0 ? '00' : '30'}`;
                        const start = formatAmPm(h);
                        const label = `${start.ampm} ${start.h12}:${m === 0 ? '00' : '30'}`;
                        slots.push({ value: val, hour: h, minute: m, label });
                    }
                }
                return slots;
            })();

            const getFilteredTimeSlots = () => {
                return ALL_TIME_SLOTS.filter(slot => {
                    if (activePeriod === 'morning') return slot.hour >= 6 && slot.hour < 12;
                    if (activePeriod === 'afternoon') return slot.hour >= 12 && slot.hour < 18;
                    if (activePeriod === 'evening') return slot.hour >= 18 && slot.hour <= 23;
                    return true;
                });
            };

            const getWeekDays = (date) => {
                const start = new Date(date);
                start.setDate(start.getDate() - start.getDay());
                const days = [];
                for (let i = 0; i < 7; i++) {
                    const d = new Date(start);
                    d.setDate(start.getDate() + i);
                    days.push(d);
                }
                return days;
            };

            const getMonthDays = (viewDate) => {
                const year = viewDate.getFullYear();
                const month = viewDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                const daysInMonth = lastDay.getDate();
                const startDayOfWeek = firstDay.getDay(); 
                
                const days = [];
                for (let i = 0; i < startDayOfWeek; i++) days.push(null);
                for (let i = 1; i <= daysInMonth; i++) days.push(new Date(year, month, i));
                return days;
            };

            const changeMonth = (offset) => {
                const newDate = new Date(calendarViewDate);
                newDate.setMonth(newDate.getMonth() + offset);
                setCalendarViewDate(newDate);
            };

            const getDayName = (dayIndex) => ['일','월','화','수','목','금','토'][dayIndex];
            const getDayColor = (dayIndex) => dayIndex === 0 ? 'text-red-500' : dayIndex === 6 ? 'text-blue-500' : 'text-gray-500';

            const dateKey = formatDateKey(currentDate);
            const dayOfWeek = currentDate.getDay();

            // Merge recurring and concrete schedules
            const getMergedScheduleMap = () => {
                const map = {};
                
                // 1. Recurring for today
                const todaysRecurring = recurring.filter(r => r.dayOfWeek === dayOfWeek);
                todaysRecurring.forEach(r => {
                    map[r.time] = { ...r, isRecurring: true };
                });

                // 2. Concrete schedules override/add
                const todaysConcrete = schedules[dateKey] || [];
                todaysConcrete.forEach(c => {
                    map[c.time] = { ...c, isRecurring: !!c.recurringOriginId };
                });

                return map;
            };

            const scheduleMap = getMergedScheduleMap();

            // Fast Inline Action: Assign text directly to time slot
            const setSlotTaskText = (timeVal, text) => {
                if (!text.trim()) {
                    clearSlotTask(timeVal);
                    return;
                }
                const currentDaySchedules = schedules[dateKey] || [];
                const existing = currentDaySchedules.find(s => s.time === timeVal);
                
                if (existing) {
                    const updated = currentDaySchedules.map(s => s.time === timeVal ? { ...s, text } : s);
                    setSchedules({ ...schedules, [dateKey]: updated });
                } else {
                    const existingRecur = recurring.find(r => r.dayOfWeek === dayOfWeek && r.time === timeVal);
                    const newEntry = {
                        id: Date.now(),
                        time: timeVal,
                        text,
                        completed: false,
                        recurringOriginId: existingRecur ? existingRecur.id : undefined
                    };
                    setSchedules({ ...schedules, [dateKey]: [...currentDaySchedules, newEntry] });
                }
                setEditingSlotTime(null);
                setInlineInputText("");
            };

            const clearSlotTask = (timeVal) => {
                const currentDaySchedules = schedules[dateKey] || [];
                const existingRecur = recurring.find(r => r.dayOfWeek === dayOfWeek && r.time === timeVal);

                if (existingRecur) {
                    showNotice("반복 일정의 기본 삭제는 좌측 메뉴(≡)에서 가능합니다.");
                    return;
                }
                const updated = currentDaySchedules.filter(s => s.time !== timeVal);
                setSchedules({ ...schedules, [dateKey]: updated });
            };

            const toggleSlotCompleted = (timeVal) => {
                const currentDaySchedules = schedules[dateKey] || [];
                const existingRecur = recurring.find(r => r.dayOfWeek === dayOfWeek && r.time === timeVal);

                if (existingRecur && !currentDaySchedules.some(s => s.time === timeVal)) {
                    const newEntry = {
                        id: Date.now(),
                        time: timeVal,
                        text: existingRecur.text,
                        completed: true,
                        recurringOriginId: existingRecur.id
                    };
                    setSchedules({ ...schedules, [dateKey]: [...currentDaySchedules, newEntry] });
                } else {
                    const updated = currentDaySchedules.map(s => {
                        if (s.time === timeVal) {
                            return { ...s, completed: !s.completed };
                        }
                        return s;
                    });
                    setSchedules({ ...schedules, [dateKey]: updated });
                }
            };

            const handleSlotClick = (timeVal) => {
                if (activeStampTask) {
                    setSlotTaskText(timeVal, activeStampTask);
                } else {
                    const existing = scheduleMap[timeVal];
                    setEditingSlotTime(timeVal);
                    setInlineInputText(existing ? existing.text : "");
                }
            };

            const handleStampClick = (task) => {
                if (editingSlotTime !== null) {
                    // 현재 입력창이 열려있으면 스탬프 텍스트를 입력창으로 자동 삽입
                    setInlineInputText(task);
                } else {
                    // 입력창이 열려있지 않을 때는 1스탬프 모드 토글
                    setActiveStampTask(activeStampTask === task ? null : task);
                }
            };

            // Task Pool Management
            const addTaskToPool = (text) => {
                if (!text.trim()) return;
                if (!tasks.includes(text)) setTasks([...tasks, text]);
            };
            const removeTaskFromPool = (task) => {
                setTasks(tasks.filter(t => t !== task));
                if (activeStampTask === task) setActiveStampTask(null);
            };

            // Recurring Management
            const toggleRecurDay = (dayIndex) => {
                if (recurDays.includes(dayIndex)) setRecurDays(recurDays.filter(d => d !== dayIndex));
                else setRecurDays([...recurDays, dayIndex].sort());
            };
            const toggleAmPm = (setter, current) => setter(current === 'AM' ? 'PM' : 'AM');

            const saveRecurringSchedule = () => {
                if (!recurText || recurDays.length === 0 || !recurStartH || !recurEndH) {
                    showNotice("시간, 내용, 요일을 모두 입력해주세요.");
                    return;
                }
                const timeStr = to24Hour(recurStartAmPm, recurStartH, recurStartM);
                const endTimeStr = to24Hour(recurEndAmPm, recurEndH, recurEndM);
                const newItems = recurDays.map(day => ({
                    id: Date.now() + Math.random(), dayOfWeek: day, time: timeStr, endTime: endTimeStr, text: recurText
                }));

                if (editingRecurGroupId) {
                    const oldRepItem = recurring.find(r => r.id === editingRecurGroupId);
                    if (oldRepItem) {
                        const oldIds = recurring.filter(r => r.time === oldRepItem.time && r.endTime === oldRepItem.endTime && r.text === oldRepItem.text).map(r => r.id);
                        const filtered = recurring.filter(r => !oldIds.includes(r.id));
                        setRecurring([...filtered, ...newItems]);
                    } else setRecurring([...recurring, ...newItems]);
                } else setRecurring([...recurring, ...newItems]);

                setEditingRecurGroupId(null); setRecurText(""); setRecurDays([]);
                setRecurStartAmPm("PM"); setRecurStartH(""); setRecurStartM("");
                setRecurEndAmPm("PM"); setRecurEndH(""); setRecurEndM("");
                showNotice("고정 스케줄이 저장되었습니다.");
            };

            const deleteRecurringGroup = (groupItem) => {
                setRecurring(recurring.filter(r => !groupItem.ids.includes(r.id)));
                showNotice(`'${groupItem.text}' 고정 스케줄이 삭제되었습니다.`);
            };

            const getGroupedRecurring = () => {
                const groups = {};
                recurring.forEach(item => {
                    const key = `${item.time}-${item.endTime}-${item.text}`;
                    if (!groups[key]) groups[key] = { ...item, days: [], ids: [] };
                    if (!groups[key].days.includes(item.dayOfWeek)) groups[key].days.push(item.dayOfWeek);
                    groups[key].ids.push(item.id);
                });
                return Object.values(groups).sort((a,b) => a.time.localeCompare(b.time));
            };

            const getDayString = (days) => {
                const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
                return days.sort((a,b) => a - b).map(d => dayNames[d]).join(', ');
            };

            const visibleSlots = getFilteredTimeSlots().filter(slot => {
                if (hideEmptySlots) return !!scheduleMap[slot.value];
                return true;
            });

            return (
                <div className="min-h-screen bg-slate-50 flex flex-col font-sans text-gray-800 pb-12">
                    
                    {/* Notice Toast */}
                    {noticeMessage && (
                        <div className="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-gray-900 text-white text-xs sm:text-sm px-4 py-2.5 rounded-full shadow-xl flex items-center gap-2 animate-fade-in border border-gray-700">
                            <AlertCircle className="w-4 h-4 text-blue-400 flex-shrink-0" />
                            <span>{noticeMessage}</span>
                        </div>
                    )}

                    {/* App Header */}
                    <header className="bg-white border-b border-gray-100 px-4 py-3 sticky top-0 z-20 flex items-center justify-between shadow-xs">
                        <div className="flex items-center gap-2">
                            {viewMode === 'monthly' ? (
                                <button 
                                    onClick={() => setViewMode('weekly')}
                                    className="p-2 bg-blue-500 text-white hover:bg-blue-600 rounded-xl transition shadow-sm flex items-center gap-1 text-sm font-bold px-3"
                                >
                                    <Home className="w-4 h-4" />
                                    <span>시간표로 돌아가기</span>
                                </button>
                            ) : (
                                <>
                                    <button 
                                        onClick={() => setIsMenuOpen(true)}
                                        className="p-2 bg-slate-100 text-slate-700 rounded-xl hover:bg-slate-200 transition"
                                        title="고정 스케줄 및 저장소 설정"
                                    >
                                        <Menu className="w-5 h-5" />
                                    </button>
                                    <h1 className="text-lg font-bold text-slate-900 flex items-center gap-1.5">
                                        <Clock className="w-5 h-5 text-blue-600" />
                                        오늘의 계획표
                                    </h1>
                                </>
                            )}
                        </div>

                        {viewMode === 'weekly' && (
                            <button 
                                onClick={() => { setViewMode('monthly'); setCalendarViewDate(currentDate); }}
                                className="p-2 text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-xl transition flex items-center gap-1 text-xs font-semibold px-3"
                                title="월간 달력"
                            >
                                <CalendarIcon className="w-4 h-4 text-blue-600" />
                                <span className="hidden sm:inline">달력 보기</span>
                            </button>
                        )}
                    </header>

                    <main className="flex-1 max-w-lg w-full mx-auto px-3 sm:px-4 py-4 flex flex-col gap-3">
                        
                        {/* Weekly vs Monthly Selector */}
                        {viewMode === 'weekly' ? (
                            <div className="bg-white rounded-2xl p-3 shadow-xs border border-gray-100">
                                <div className="grid grid-cols-7 gap-1">
                                    {getWeekDays(currentDate).map((date, idx) => {
                                        const isSelected = formatDateKey(date) === dateKey;
                                        const isToday = formatDateKey(date) === formatDateKey(new Date());
                                        const dNum = date.getDate();
                                        const dIdx = date.getDay();
                                        const dName = getDayName(dIdx);
                                        const colorClass = getDayColor(dIdx);
                                        
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => { setCurrentDate(date); setEditingSlotTime(null); }}
                                                className={`relative flex flex-col items-center justify-center w-full h-16 rounded-xl transition-all ${
                                                    isSelected 
                                                        ? 'bg-blue-600 text-white shadow-md font-bold' 
                                                        : 'bg-slate-50 hover:bg-slate-100 text-slate-700'
                                                }`}
                                            >
                                                {isToday && (
                                                    <span className={`absolute -top-2 left-1/2 transform -translate-x-1/2 text-[10px] font-black px-1.5 py-0.5 rounded-full whitespace-nowrap ${isSelected ? 'bg-white text-blue-600' : 'bg-blue-500 text-white'}`}>
                                                        오늘
                                                    </span>
                                                )}
                                                <span className={`text-xs font-semibold ${isSelected ? 'text-blue-100' : colorClass}`}>{dName}</span>
                                                <span className="text-lg font-extrabold">{dNum}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        ) : (
                            <div className="bg-white rounded-2xl shadow-xs p-4 border border-gray-100 animate-fade-in">
                                <div className="flex justify-between items-center mb-4">
                                    <button onClick={() => changeMonth(-1)} className="p-2 hover:bg-slate-100 rounded-full"><ChevronLeft className="w-5 h-5" /></button>
                                    <span className="font-bold text-lg">{calendarViewDate.getFullYear()}년 {calendarViewDate.getMonth() + 1}월</span>
                                    <button onClick={() => changeMonth(1)} className="p-2 hover:bg-slate-100 rounded-full"><ChevronRight className="w-5 h-5" /></button>
                                </div>
                                
                                <div className="grid grid-cols-7 gap-1 text-center mb-2">
                                    {['일','월','화','수','목','금','토'].map((d, i) => (
                                        <div key={i} className={`text-xs font-bold ${i===0?'text-red-500':i===6?'text-blue-500':'text-slate-400'}`}>{d}</div>
                                    ))}
                                </div>
                                
                                <div className="grid grid-cols-7 gap-1">
                                    {getMonthDays(calendarViewDate).map((date, i) => {
                                        if (!date) return <div key={i}></div>;
                                        const isToday = formatDateKey(date) === formatDateKey(new Date());
                                        const isSelected = formatDateKey(date) === formatDateKey(currentDate);
                                        const dayIdx = date.getDay();
                                        
                                        return (
                                            <button
                                                key={i}
                                                onClick={() => { setCurrentDate(date); setViewMode('weekly'); }}
                                                className={`h-11 rounded-xl flex flex-col items-center justify-center transition relative
                                                    ${isSelected ? 'bg-blue-600 text-white shadow-md font-bold' : 'hover:bg-slate-100'}
                                                    ${isToday && !isSelected ? 'border border-blue-500 text-blue-600' : ''}
                                                    ${!isSelected && !isToday ? (dayIdx===0?'text-red-500':dayIdx===6?'text-blue-500':'text-slate-700') : ''}
                                                `}
                                            >
                                                <span className="text-sm font-bold">{date.getDate()}</span>
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {tasks.length > 0 && viewMode === 'weekly' && (
                            <div className="bg-white rounded-xl p-2.5 shadow-xs border border-gray-100 flex flex-col gap-1.5">
                                <div className="flex items-center justify-between text-sm text-slate-500 font-semibold px-1">
                                    <span className="flex items-center gap-1 text-blue-600 font-bold">
                                        <Sparkles className="w-4 h-4" />
                                        할 일 스탬프
                                    </span>
                                    {activeStampTask && (
                                        <button 
                                            onClick={() => setActiveStampTask(null)}
                                            className="text-xs text-red-500 font-bold underline"
                                        >
                                            선택 해제
                                        </button>
                                    )}
                                </div>
                                <div className="flex flex-wrap gap-1.5">
                                    {tasks.map((task, idx) => {
                                        const isSelected = activeStampTask === task;
                                        return (
                                            <button
                                                key={idx}
                                                onClick={() => handleStampClick(task)}
                                                className={`px-3 py-1.5 rounded-lg text-sm font-semibold border transition flex items-center gap-1 ${
                                                    isSelected 
                                                        ? 'bg-blue-600 text-white border-blue-600 shadow-xs ring-2 ring-blue-200' 
                                                        : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-slate-100'
                                                }`}
                                            >
                                                {isSelected && <Check className="w-3.5 h-3.5" />}
                                                {task}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        <div className="bg-white rounded-2xl shadow-xs border border-gray-100 flex flex-col overflow-hidden">
                            
                            {/* Filter Bar */}
                            <div className="p-3 border-b border-gray-100 bg-slate-50/50 flex flex-col gap-2">
                                <div className="flex items-center justify-between">
                                    <span className="text-base font-bold text-slate-800 flex items-center gap-1">
                                        <span className="bg-blue-600 text-white text-sm px-2 py-0.5 rounded-md font-bold">
                                            {currentDate.getMonth()+1}월 {currentDate.getDate()}일
                                        </span>
                                        시간표
                                    </span>

                                    {/* Hide Empty Toggle */}
                                    <button 
                                        onClick={() => setHideEmptySlots(!hideEmptySlots)}
                                        className={`px-2.5 py-1 rounded-lg text-sm font-bold transition flex items-center gap-1 border ${
                                            hideEmptySlots 
                                                ? 'bg-blue-50 text-blue-600 border-blue-200' 
                                                : 'bg-white text-slate-500 border-slate-200 hover:bg-slate-50'
                                        }`}
                                    >
                                        {hideEmptySlots ? <EyeOff className="w-4 h-4" /> : <Eye className="w-4 h-4" />}
                                        <span>{hideEmptySlots ? '등록된 것만' : '전체 30분칸'}</span>
                                    </button>
                                </div>

                                {/* Period Filter Tabs */}
                                {!hideEmptySlots && (
                                    <div className="grid grid-cols-4 gap-1 p-1 bg-slate-200/60 rounded-xl text-sm font-bold text-slate-600">
                                        <button 
                                            onClick={() => setActivePeriod('all')} 
                                            className={`py-1.5 rounded-lg transition ${activePeriod === 'all' ? 'bg-white text-slate-900 shadow-xs' : 'hover:text-slate-900'}`}
                                        >
                                            전체
                                        </button>
                                        <button 
                                            onClick={() => setActivePeriod('morning')} 
                                            className={`py-1.5 rounded-lg transition flex items-center justify-center gap-1 ${activePeriod === 'morning' ? 'bg-white text-blue-600 shadow-xs' : 'hover:text-slate-900'}`}
                                        >
                                            <Sunrise className="w-3.5 h-3.5" /> 오전
                                        </button>
                                        <button 
                                            onClick={() => setActivePeriod('afternoon')} 
                                            className={`py-1.5 rounded-lg transition flex items-center justify-center gap-1 ${activePeriod === 'afternoon' ? 'bg-white text-orange-500 shadow-xs' : 'hover:text-slate-900'}`}
                                        >
                                            <Sun className="w-3.5 h-3.5" /> 오후
                                        </button>
                                        <button 
                                            onClick={() => setActivePeriod('evening')} 
                                            className={`py-1.5 rounded-lg transition flex items-center justify-center gap-1 ${activePeriod === 'evening' ? 'bg-white text-indigo-600 shadow-xs' : 'hover:text-slate-900'}`}
                                        >
                                            <Moon className="w-3.5 h-3.5" /> 저녁
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div className="divide-y divide-slate-100 max-h-[580px] overflow-y-auto">
                                {visibleSlots.length === 0 ? (
                                    <div className="p-8 text-center text-slate-400 text-base">
                                        {hideEmptySlots ? '등록된 일정이 없습니다. 상단 태그나 시간 칸을 눌러 작성해보세요!' : '해당 시간대의 일정이 없습니다.'}
                                    </div>
                                ) : (
                                    visibleSlots.map((slot) => {
                                        const item = scheduleMap[slot.value];
                                        const isEditing = editingSlotTime === slot.value;
                                        const isFilled = !!item;

                                        return (
                                            <div 
                                                key={slot.value} 
                                                className={`flex items-center gap-3 px-3 py-2.5 transition-colors ${
                                                    isEditing 
                                                        ? 'bg-blue-50/70' 
                                                        : isFilled 
                                                            ? (item.completed ? 'bg-slate-50/80' : 'bg-white hover:bg-slate-50/50') 
                                                            : 'bg-white hover:bg-blue-50/30'
                                                }`}
                                            >
                                                {/* Left Time Badge (12h format) */}
                                                <div className="w-22 flex-shrink-0 font-mono text-sm font-bold text-slate-500 flex flex-col justify-center">
                                                    <span className={slot.minute === 0 ? 'text-slate-900 font-extrabold text-sm' : 'text-slate-400'}>
                                                        {slot.label}
                                                    </span>
                                                </div>

                                                <div className="w-px h-6 bg-slate-200/60 flex-shrink-0"></div>

                                                {/* Right Task Content / In-line Input */}
                                                <div className="flex-1 min-w-0">
                                                    {isEditing ? (
                                                        <form 
                                                            onSubmit={(e) => {
                                                                e.preventDefault();
                                                                setSlotTaskText(slot.value, inlineInputText);
                                                            }}
                                                            className="flex items-center gap-2"
                                                        >
                                                            <input 
                                                                type="text"
                                                                autoFocus
                                                                className="flex-1 px-3 py-1.5 text-base border border-blue-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white"
                                                                placeholder="할 일 직접 입력..."
                                                                value={inlineInputText}
                                                                onChange={(e) => setInlineInputText(e.target.value)}
                                                            />
                                                            <button 
                                                                type="submit"
                                                                className="px-3 py-1.5 bg-blue-600 text-white rounded-lg text-sm font-bold hover:bg-blue-700 whitespace-nowrap"
                                                            >
                                                                저장
                                                            </button>
                                                            <button 
                                                                type="button"
                                                                onClick={() => setEditingSlotTime(null)}
                                                                className="p-1.5 text-slate-400 hover:text-slate-600"
                                                            >
                                                                <X className="w-4 h-4" />
                                                            </button>
                                                        </form>
                                                    ) : isFilled ? (
                                                        <div className="flex items-center justify-between gap-2 group">
                                                            <div 
                                                                onClick={() => handleSlotClick(slot.value)}
                                                                className="flex-1 cursor-pointer flex items-center gap-2 min-w-0"
                                                            >
                                                                <span className={`text-base font-semibold truncate ${item.completed ? 'line-through text-slate-300' : 'text-slate-800'}`}>
                                                                    {item.text}
                                                                </span>
                                                                {item.isRecurring && !item.recurringOriginId && (
                                                                    <span className="text-xs bg-purple-100 text-purple-700 px-1.5 py-0.5 rounded font-bold whitespace-nowrap">
                                                                        반복
                                                                    </span>
                                                                )}
                                                            </div>

                                                            <div className="flex items-center gap-1">
                                                                <button 
                                                                    onClick={() => handleSlotClick(slot.value)}
                                                                    className="p-1 text-slate-300 hover:text-blue-600 rounded"
                                                                    title="수정"
                                                                >
                                                                    <Edit2 className="w-4 h-4" />
                                                                </button>
                                                                <button 
                                                                    onClick={() => clearSlotTask(slot.value)}
                                                                    className="p-1 text-slate-300 hover:text-red-500 rounded"
                                                                    title="지우기"
                                                                >
                                                                    <Trash2 className="w-4 h-4" />
                                                                </button>
                                                                <button 
                                                                    onClick={() => toggleSlotCompleted(slot.value)}
                                                                    className={`w-6 h-6 rounded-lg border flex items-center justify-center transition-all ml-1 ${
                                                                        item.completed 
                                                                            ? 'bg-emerald-500 border-emerald-500 text-white' 
                                                                            : 'border-slate-300 hover:border-emerald-400'
                                                                    }`}
                                                                >
                                                                    {item.completed && <Check className="w-4 h-4 stroke-[3]" />}
                                                                </button>
                                                            </div>
                                                        </div>
                                                    ) : (
                                                        <div 
                                                            onClick={() => handleSlotClick(slot.value)}
                                                            className="cursor-pointer py-1 text-slate-400 hover:text-blue-500 text-sm font-medium transition flex items-center gap-1 group"
                                                        >
                                                            <Plus className="w-4 h-4 opacity-0 group-hover:opacity-100 transition-opacity" />
                                                            <span>{activeStampTask ? `'${activeStampTask}' 바로 채우기` : '+ 터치하여 할 일 입력'}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })
                                )}
                            </div>
                        </div>

                    </main>

                    {isMenuOpen && (
                        <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 animate-fade-in">
                            <div className="bg-white w-full max-w-md rounded-2xl shadow-xl flex flex-col max-h-[85vh] overflow-hidden">
                                <div className="p-4 border-b flex justify-between items-center bg-slate-50">
                                    <h3 className="font-bold text-base text-slate-800">설정 및 관리</h3>
                                    <button onClick={() => setIsMenuOpen(false)}><X className="w-5 h-5 text-slate-400" /></button>
                                </div>
                                
                                <div className="overflow-y-auto p-4 space-y-6 flex-1">
                                    
                                    {/* Recurring Schedule */}
                                    <section>
                                        <h4 className="flex items-center gap-1.5 font-bold text-blue-700 mb-2.5 text-sm">
                                            <Repeat className="w-4 h-4" />
                                            {editingRecurGroupId ? '고정 스케줄 수정' : '고정 스케줄 등록'}
                                        </h4>
                                        
                                        <div className="p-3.5 rounded-xl bg-slate-50 border border-slate-200 flex flex-col gap-3">
                                            <div className="flex items-center gap-1.5 flex-wrap text-xs font-bold">
                                                {/* Start Time */}
                                                <div className="flex items-center gap-1 bg-white p-1 rounded-lg border">
                                                    <button onClick={() => toggleAmPm(setRecurStartAmPm, recurStartAmPm)} className="px-1.5 py-0.5 bg-slate-100 rounded text-blue-600">
                                                        {recurStartAmPm}
                                                    </button>
                                                    <input type="text" inputMode="numeric" maxLength={2} className="w-7 text-center p-0.5 outline-none font-bold" value={recurStartH} onChange={(e) => setRecurStartH(e.target.value)} placeholder="시" />
                                                    <span>:</span>
                                                    <input type="text" inputMode="numeric" maxLength={2} className="w-7 text-center p-0.5 outline-none font-bold" value={recurStartM} onChange={(e) => setRecurStartM(e.target.value)} placeholder="분" />
                                                </div>
                                                <span>~</span>
                                                {/* End Time */}
                                                <div className="flex items-center gap-1 bg-white p-1 rounded-lg border">
                                                    <button onClick={() => toggleAmPm(setRecurEndAmPm, recurEndAmPm)} className="px-1.5 py-0.5 bg-slate-100 rounded text-blue-600">
                                                        {recurEndAmPm}
                                                    </button>
                                                    <input type="text" inputMode="numeric" maxLength={2} className="w-7 text-center p-0.5 outline-none font-bold" value={recurEndH} onChange={(e) => setRecurEndH(e.target.value)} placeholder="시" />
                                                    <span>:</span>
                                                    <input type="text" inputMode="numeric" maxLength={2} className="w-7 text-center p-0.5 outline-none font-bold" value={recurEndM} onChange={(e) => setRecurEndM(e.target.value)} placeholder="분" />
                                                </div>
                                            </div>

                                            <input 
                                                type="text"
                                                placeholder="내용 (예: 수학학원, 운동)"
                                                className="w-full p-2 bg-white rounded-lg border text-xs font-medium outline-none focus:ring-1 focus:ring-blue-500"
                                                value={recurText}
                                                onChange={(e) => setRecurText(e.target.value)}
                                            />
                                            
                                            {/* Days Selector */}
                                            <div className="flex justify-between gap-1">
                                                {['일','월','화','수','목','금','토'].map((d, i) => (
                                                    <button
                                                        key={i}
                                                        onClick={() => toggleRecurDay(i)}
                                                        className={`w-8 h-8 rounded-full text-xs font-bold transition-all ${
                                                            recurDays.includes(i)
                                                                ? 'bg-blue-600 text-white shadow-xs'
                                                                : 'bg-white border text-slate-400 hover:border-blue-300'
                                                        }`}
                                                    >
                                                        {d}
                                                    </button>
                                                ))}
                                            </div>
                                            
                                            <button 
                                                onClick={saveRecurringSchedule}
                                                className="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold transition"
                                                disabled={!recurText || recurDays.length === 0}
                                            >
                                                {editingRecurGroupId ? '수정 완료' : '고정 스케줄 저장'}
                                            </button>
                                        </div>

                                        {/* List of Recurring Items */}
                                        <div className="mt-3 space-y-1.5">
                                            {getGroupedRecurring().map((groupItem, idx) => (
                                                <div key={idx} className="flex justify-between items-center border p-2 rounded-lg text-xs bg-white">
                                                    <div className="flex flex-col gap-0.5">
                                                        <div className="flex items-center gap-1.5">
                                                            <span className="font-bold text-blue-600 bg-blue-50 px-1 py-0.2 rounded">
                                                                {getDayString(groupItem.days)}
                                                            </span>
                                                            <span className="font-bold text-slate-500">{format12HStr(groupItem.time)} ~ {format12HStr(groupItem.endTime)}</span>
                                                        </div>
                                                        <span className="text-slate-800 font-medium">{groupItem.text}</span>
                                                    </div>
                                                    <button onClick={() => deleteRecurringGroup(groupItem)} className="p-1 text-slate-300 hover:text-red-500">
                                                        <Trash2 className="w-3.5 h-3.5" />
                                                    </button>
                                                </div>
                                            ))}
                                        </div>
                                    </section>

                                    <div className="border-t"></div>

                                    {/* Task Pool Management */}
                                    <section>
                                        <h4 className="flex items-center gap-1.5 font-bold text-slate-700 mb-2.5 text-sm">
                                            <Sparkles className="w-4 h-4 text-amber-500" />
                                            자주 쓰는 할 일
                                        </h4>
                                        <div className="flex gap-1.5 mb-2.5">
                                            <input 
                                                type="text"
                                                placeholder="예: 영어 단어 암기"
                                                className="flex-1 p-2 border rounded-lg text-xs outline-none focus:ring-1 focus:ring-blue-500"
                                                id="newTagInput"
                                                onKeyDown={(e) => {
                                                    if(e.key==='Enter') {
                                                        addTaskToPool(e.target.value);
                                                        e.target.value = '';
                                                    }
                                                }}
                                            />
                                            <button 
                                                onClick={() => {
                                                    const input = document.getElementById('newTagInput');
                                                    addTaskToPool(input.value);
                                                    input.value = '';
                                                }}
                                                className="bg-slate-900 text-white px-3 py-2 rounded-lg text-xs font-bold hover:bg-slate-800"
                                            >
                                                추가
                                            </button>
                                        </div>
                                        <div className="flex flex-wrap gap-1.5">
                                            {tasks.map((task, idx) => (
                                                <span key={idx} className="flex items-center gap-1 bg-slate-100 px-2.5 py-1 rounded-lg text-xs text-slate-700 font-medium">
                                                    {task}
                                                    <button onClick={() => removeTaskFromPool(task)} className="text-slate-400 hover:text-red-500 ml-0.5">
                                                        <X className="w-3 h-3" />
                                                    </button>
                                                </span>
                                            ))}
                                        </div>
                                    </section>

                                </div>
                            </div>
                        </div>
                    )}

                    <style>{`
                        @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
                        .animate-fade-in { animation: fade-in 0.15s ease-out forwards; }
                    `}</style>
                </div>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<TodaysPlan />);
    </script>
</body>
</html>
